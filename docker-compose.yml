services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ozelguvenlik
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/ozelguvenlik
      NODE_ENV: production
      BASE_PATH: /
      PORT: "8080"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_DOWNLOAD: "true"
      WWEBJS_AUTH_PATH: /app/.wwebjs_auth
      WA_AUTO_CONNECT: "1"
    depends_on:
      - postgres
    shm_size: "256mb"
    volumes:
      - wa_auth:/app/.wwebjs_auth

volumes:
  pgdata:
  wa_auth:
