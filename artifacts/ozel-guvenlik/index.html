    <script>
      // Pre-paint theme init — avoids flash. Default = dark.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script>
      // Düşük cihaz: paint öncesi lite + kalıcı tercih (Pro seçilmediyse)
      (function () {
        try {
          var pref = localStorage.getItem("og_display_mode");
          if (pref === "full") return;
          if (pref === "lite") {
            document.documentElement.classList.add("og-lite");
            return;
          }
          var lite = false;
          if (localStorage.getItem("og_boot_slow") === "1") lite = true;
          var mem = navigator.deviceMemory;
          if (mem && mem <= 2) lite = true;
          var cores = navigator.hardwareConcurrency;
          if (cores && cores <= 2) lite = true;
          if (typeof mem !== "number" && cores === 1) lite = true;
          if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) lite = true;
          var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
          if (conn && (conn.saveData || conn.effectiveType === "slow-2g" || conn.effectiveType === "2g" || conn.effectiveType === "3g")) lite = true;
          if (lite) {
            document.documentElement.classList.add("og-lite");
            document.documentElement.classList.add("dark");
            if (!pref) localStorage.setItem("og_display_mode", "lite");
          }
        } catch (e) {}
      })();
    </script>

    <div id="root">
      <div id="_boot-splash" style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#0F172A;flex-direction:column;gap:12px;padding:20px;text-align:center;color:#F1F5F9;font-family:system-ui,-apple-system,sans-serif">
        <div style="width:36px;height:36px;border:3px solid rgba(245,197,24,0.25);border-top-color:#f5c518;border-radius:50%;animation:_ogsp 0.9s linear infinite"></div>
        <p style="margin:0;font-size:13px;color:#94A3B8">Yükleniyor…</p>
        <style>@keyframes _ogsp{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      window.__OG_BOOT_OK = false;
      window.__OG_BOOT_RELOADED = false;
      window._forceRecover = function() {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }).catch(function() {}).finally(function() {
              if ("caches" in window) {
                caches.keys().then(function(k) {
                  return Promise.all(k.map(function(c) { return caches.delete(c); }));
                }).catch(function() {}).finally(function() {
                  try { localStorage.clear(); } catch(e) {}
                  try { sessionStorage.clear(); } catch(e) {}
                  window.location.replace(window.location.pathname + "?_r=" + Date.now());
                });
              } else {
                window.location.replace(window.location.pathname + "?_r=" + Date.now());
              }
            });
          } else {
            window.location.replace(window.location.pathname + "?_r=" + Date.now());
          }
        } catch (e) {
          window.location.reload();
        }
      };
      // Düşük cihaz: JS açılmazsa Lite moda zorla ve bir kez yenile
      setTimeout(function () {
        if (window.__OG_BOOT_OK) return;
        try {
          if (localStorage.getItem("og_display_mode") !== "full") {
            localStorage.setItem("og_display_mode", "lite");
            localStorage.setItem("og_boot_slow", "1");
          }
        } catch (e) {}
        if (!window.__OG_BOOT_RELOADED) {
          window.__OG_BOOT_RELOADED = true;
          window.location.reload();
          return;
        }
        var splash = document.getElementById("_boot-splash");
        if (splash && !document.getElementById("_boot-recover")) {
          var btn = document.createElement("button");
          btn.id = "_boot-recover";
          btn.type = "button";
          btn.textContent = "Yeniden dene";
          btn.style.cssText = "margin-top:8px;padding:10px 16px;border:0;border-radius:10px;background:#f5c518;color:#0a0e1a;font-weight:700;font-size:13px;cursor:pointer";
          btn.onclick = function () { window._forceRecover(); };
          splash.appendChild(btn);
        }
      }, 9000);
    </script>
