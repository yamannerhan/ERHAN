      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

          document.documentElement.classList.add("og-lite", "dark");
          localStorage.setItem("og_display_mode", "lite");
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }).catch(function () {});
          }
        } catch (e) {}
      })();

    <div id="root">
      <div id="_boot-splash" class="og-pwa-splash" aria-hidden="true">
        <div class="og-pwa-splash__glow"></div>
        <div class="og-pwa-splash__logo-wrap">
          <img src="/brand-logo.png" alt="" class="og-pwa-splash__logo" width="118" height="118" decoding="sync" />

        <p class="og-pwa-splash__brand"><span>ozelguvenlik</span>.online</p>

        <div class="og-pwa-splash__ring" role="presentation"></div>
      </div>
    </div>
    <script>
      window.__OG_BOOT_OK = false;
      window.__OG_BOOT_RELOADED = false;
      window._forceRecover = function() {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }).catch(function() {}).finally(function() {
              if ("caches" in window) {
                caches.keys().then(function(k) {
                  return Promise.all(k.map(function(c) { return caches.delete(c); }));
                }).catch(function() {}).finally(function() {
                  try { localStorage.clear(); } catch(e) {}
                  try { sessionStorage.clear(); } catch(e) {}
                  window.location.replace(window.location.pathname + "?_r=" + Date.now());
                });
              } else {
                window.location.replace(window.location.pathname + "?_r=" + Date.now());
              }
            });
          } else {
            window.location.replace(window.location.pathname + "?_r=" + Date.now());
          }
        } catch (e) {
          window.location.reload();
        }
      };
      // Düşük cihaz: JS açılmazsa Lite moda zorla ve bir kez yenile
      setTimeout(function () {
        if (window.__OG_BOOT_OK) return;
        try {
          if (localStorage.getItem("og_display_mode") !== "full") {
            localStorage.setItem("og_display_mode", "lite");
            localStorage.setItem("og_boot_slow", "1");
          }
        } catch (e) {}
        if (!window.__OG_BOOT_RELOADED) {
          window.__OG_BOOT_RELOADED = true;
          window.location.reload();
          return;
        }
        var splash = document.getElementById("_boot-splash");
        if (splash && !document.getElementById("_boot-recover")) {
          var btn = document.createElement("button");
          btn.id = "_boot-recover";
          btn.type = "button";
          btn.textContent = "Yeniden dene";
          btn.style.cssText = "margin-top:8px;padding:10px 16px;border:0;border-radius:10px;background:#f5c518;color:#0a0e1a;font-weight:700;font-size:13px;cursor:pointer";
          btn.onclick = function () { window._forceRecover(); };
          splash.appendChild(btn);
        }
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener("error", function () {
        if (window.__OG_BOOT_OK) return;
        try { localStorage.setItem("og_display_mode", "lite"); } catch (e) {}
      });
    </script>
